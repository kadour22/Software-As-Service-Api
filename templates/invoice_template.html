<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; }
        h2 { color: #333; }
        .invoice { margin: 20px; }
    </style>
</head>
<body>
    <div class="invoice">
        <h2>Invoice</h2>
        <p><strong>Invoice ID:</strong> {{ billing.id }}</p>
        <p><strong>User:</strong> {{ billing.user.username }}</p>
        <p><strong>Amount:</strong> ${{ billing.amount }}</p>
        <p><strong>Billing Date:</strong> {{ billing.billing_date }}</p>
        <p><strong>Status:</strong> {{ billing.payment_status }}</p>
    </div>
</body>
</html>
